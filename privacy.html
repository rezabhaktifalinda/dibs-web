<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy policy — DIBS</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#737700;
    --heading:#232612;
    --body:#2E2D26;
    --paper:#FAF7EF;
    --rule:#E9EAD0;
    --muted:#6B6A5E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:300;
    background:var(--paper);
    color:var(--body);
    font-size:16px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:64px 26px 90px}

  .mark{
    display:inline-block;margin-bottom:56px;
    font-size:34px;letter-spacing:-.035em;line-height:1;
    text-transform:uppercase;text-decoration:none;color:var(--brand);
  }
  h1{
    color:var(--heading);text-transform:uppercase;font-weight:300;
    font-size:clamp(22px,5.5vw,32px);letter-spacing:.01em;line-height:1.25;
  }
  .updated{
    color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:11px;margin:14px 0 46px;
  }
  h2{
    color:var(--brand);text-transform:uppercase;font-weight:300;
    font-size:13px;letter-spacing:.16em;
    margin:0 0 16px;padding-top:34px;border-top:1px solid var(--rule);
  }
  section{margin-bottom:34px}
  p{margin-bottom:14px}
  p:last-child{margin-bottom:0}
  ul{list-style:none}
  li{
    padding-left:20px;position:relative;margin-bottom:10px;
  }
  li::before{
    content:'';position:absolute;left:0;top:12px;
    width:7px;height:1px;background:var(--brand);
  }
  a{color:var(--brand)}
  strong{font-weight:400}
  footer{
    margin-top:54px;padding-top:26px;border-top:1px solid var(--rule);
    text-transform:uppercase;letter-spacing:.16em;font-size:11px;opacity:.6;
  }
  footer a{text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <a class="mark" href="/">Dibs</a>

  <h1>[PLACEHOLDER] Privacy policy</h1>
  <p class="updated">Draft — final text to be supplied</p>

  <p>[PLACEHOLDER — the real privacy policy text goes here.]</p>

  <section>
    <h2>Contact</h2>
    <p><a href="mailto:hello@wearedibs.com">hello@wearedibs.com</a></p>
  </section>

  <footer><a href="/">← Back</a></footer>

</div>
</body>
</html>
